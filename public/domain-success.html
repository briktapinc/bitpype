<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Payment received — BitPype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8; --card: #ffffff; --ink: #14201a; --muted: #5c6b64;
      --accent: #0c8a5f; --accent-dark: #0b6e4c; --line: rgba(11, 17, 32, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--ink); padding: 1.25rem;
    }
    main {
      width: min(30rem, 100%); background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 2rem 1.75rem; box-shadow: 0 4px 18px rgba(11,17,32,0.05);
    }
    .brand { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 1rem; }
    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 0.7rem; font-weight: 700; }
    p { margin: 0 0 0.9rem; line-height: 1.6; color: var(--muted); }
    p strong { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="brand">BitPype</p>
    <h1>Payment received — thank you!</h1>
    <p id="body">We are registering your domain and putting your site live.</p>
    <p>We will email you as soon as your site is up. There is nothing else you need to do.</p>
  </main>
  <script>
    (function () {
      const domain = new URLSearchParams(location.search).get('domain') || '';
      if (domain) {
        document.getElementById('body').innerHTML =
          'We are registering <strong></strong> and putting your site live.';
        document.querySelector('#body strong').textContent = domain;
      }
    })();
  </script>
</body>
</html>
