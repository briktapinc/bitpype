<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site module</title>
  <style>
    :root {
      --ink: #1c140f;
      --muted: #5c5148;
      --line: rgba(28, 20, 15, 0.12);
      --paper: #fffaf4;
      --accent: #0e7a68;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: #f4efe6;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div
    class="bitpype-module-embed bitpype-module-standalone"
    data-bitpype-module="1"
    data-bitpype-module-token=""
    data-bitpype-show-title="1"
    data-bitpype-standalone-viewer="1"
    id="app"
  ></div>
  <script>
    (function () {
      // Batch 180 (H3): this viewer is served from the platform
      // origin under a sandboxed CSP (see server.js EMBED_MODULE_CSP).
      // The marker tells module-embed.js it is rendering in the
      // standalone viewer, where Custom Code must be isolated in its
      // own sandboxed iframe instead of executing in this document.
      window.__BP_EMBED_VIEWER__ = true;
      var params = new URLSearchParams(location.search);
      var token = params.get('token') || '';
      var item = params.get('slug') || params.get('item') || '';
      var el = document.getElementById('app');
      if (el) {
        el.setAttribute('data-bitpype-module-token', token);
        el.setAttribute('data-bitpype-api', location.origin);
      }
      if (item && !new URLSearchParams(location.search).get('bpItem')) {
        try {
          var u = new URL(location.href);
          u.searchParams.set('bpItem', item);
          history.replaceState(null, '', u.pathname + '?' + u.searchParams.toString());
        } catch (e) {
          /* sandboxed (opaque-origin) documents may refuse the
             history API — the slug still rides the API query. */
        }
      }
    })();
  </script>
  <script src="/js/module-embed.js?v=mod43" data-bitpype-module-script="1"></script>
</body>
</html>
